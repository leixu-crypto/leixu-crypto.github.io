name: Update Google Scholar Citations

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Update citation count
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python google_scholar_crawler/main.py

      - name: Commit and push changes
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add results/gs_data.json
          if git diff --cached --quiet; then
            echo "Citation count has not changed"
          else
            git commit -m "Auto update citation count"
            git push
          fi
